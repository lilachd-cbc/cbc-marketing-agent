name: Flyer rendering checks
on:
  pull_request:
    paths: ['flyer/**', 'test-*.json', 'package*.json', '.github/workflows/flyer-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test flyer/test.js
      - run: node flyer/render-check.js
      - uses: actions/upload-artifact@v4
        with:
          name: flyer-samples-not-for-publication
          path: output/check-*.jpg
